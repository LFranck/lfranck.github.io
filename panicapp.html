<!DOCTYPE html>
<!--
  Panic App — Prototype web du flux V1 (démo navigateur)
  Rejoue le principe d'utilisation du document de conception : bouton PANIC,
  session vocale (Text-to-Speech + SpeechRecognition du navigateur), moteur de
  questions adaptatif, machine à états. L'application finale sera native Android
  (Kotlin) ; ceci n'est qu'un prototype pour valider l'expérience avant de coder l'app.

  Ces informations (version, auteur, date, licence) sont la source unique :
  elles sont reprises dans les constantes APP_* du script et affichées dans
  la pop-up "Informations" (icône ℹ️ de l'en-tête) — ne pas les dupliquer ailleurs.

  Version : 0.3.0
  Auteur  : Franck Legrand <franck.legrand@gmail.com>
  Date    : 2026-09-24
  Licence : Utilisation libre (usage personnel/éducatif), sans garantie.
  Statut  : En développement (V0) — fonctions de base en place, débogage en cours.
  © 2026 Franck Legrand. Tous droits réservés.
-->
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panic App — Prototype V1</title>
<style>
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; font-family:system-ui,-apple-system,Segoe UI,sans-serif;
    background:#111; color:#fff; display:flex; flex-direction:column;
  }

  }

    border-bottom:1px solid #4a3418;
  }
  main { flex:1; display:flex; align-items:center; justify-content:center; padding:20px; overflow:auto; }

  /* Lien "Informations" (en-tête) et sa pop-up (version, auteur, date, licence) */
  #infoLink {
    background:none; border:0; color:#aaa; font-size:13px; text-decoration:underline;
    cursor:pointer; padding:4px;
  }
  #infoLink:hover { color:#fff; }
  /* Lien de soutien Ko-fi (en-tête) : pastille ambrée ; sur petit écran, la tasse seule. */
  #kofiLink {
    display:inline-flex; align-items:center; gap:5px; padding:5px 12px; border-radius:999px;
    background:#f5a524; color:#1a1206; font-size:13px; font-weight:700; text-decoration:none; white-space:nowrap;
  }
  #kofiLink:hover { background:#ffb940; }
  @media (max-width:560px) { #kofiLink .kofiText { display:none; } }
  #infoDialog {
    background:#1b1b1b; color:#eee; border:1px solid #333; border-radius:14px;
    padding:22px 26px; max-width:min(420px,90vw);
  }
  #infoDialog::backdrop { background:rgba(0,0,0,.6); }
  #infoDialog h2 { margin:0 0 12px; font-size:18px; }
  #infoDialog dl { margin:0 0 16px; display:grid; grid-template-columns:auto 1fr; gap:6px 12px; font-size:14px; }
  #infoDialog dt { color:#999; }
  #infoDialog dd { margin:0; }
  #infoDialog button { padding:8px 16px; font-size:14px; border:0; border-radius:10px; cursor:pointer; background:#fff; color:#111; font-weight:700; }

  .panel {
    width:min(460px,94vw); display:flex; flex-direction:column; align-items:center;
    gap:22px; background:#161616; border:1px solid #262626; border-radius:22px;
    padding:clamp(24px,5vh,40px) clamp(20px,4vw,32px); box-shadow:0 20px 60px rgba(0,0,0,.45);
  }
  .screen { width:100%; display:flex; flex-direction:column; align-items:center; gap:22px; }
  .screen[hidden] { display:none; }

  /* --- Accueil --- */
  .panic-btn {
    width:min(190px,55vw); aspect-ratio:1; border-radius:50%; border:0; cursor:pointer;
    background:radial-gradient(circle at 35% 30%,#ff6b5a,#c62f22);
    color:#fff; font-size:22px; font-weight:800; letter-spacing:.04em;
    box-shadow:0 0 0 8px rgba(198,47,34,.15), 0 18px 40px rgba(198,47,34,.35);
  }
  .panic-btn:active { transform:scale(.97); }

  /* --- Session --- */

  .state-dot.starting, .state-dot.speaking { background:#3b82f6; }

  .state-dot.evaluating, .state-dot.next_question { background:#f59e0b; }
  .state-dot.stopped { background:#ef4444; }

  label { display:flex; flex-direction:column; gap:6px; color:#ccc; font-size:14px; }

  select {
    background:#1b1b1b; color:#fff; border:1px solid #333; border-radius:8px; padding:9px 10px;
  }
  .row { flex-direction:row; align-items:center; gap:8px; }
  .value { font-weight:700; color:#fff; }
</style>
</head>

<script>
// ---------- Support navigateur ----------
const synth = window.speechSynthesis;
const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
const sttSupported = !!SpeechRecognitionCtor;
let recognizer = null;
if (sttSupported) {
  recognizer = new SpeechRecognitionCtor();
  recognizer.lang = "fr-FR";
  recognizer.continuous = false;
  recognizer.interimResults = false;
  recognizer.maxAlternatives = 1;
}
const banner = document.getElementById("banner");
if (!sttSupported) {
  banner.hidden = false;
  banner.textContent = "⚠️ Reconnaissance vocale non disponible sur ce navigateur (essaie Chrome ou Edge). La session se déroulera en lecture seule, sans écoute des réponses.";
}
document.getElementById("statusHeader").textContent = sttSupported ? "🎙️ Micro disponible" : "🎙️ Micro indisponible";

// Métadonnées de l'application — source unique, reprise dans la pop-up "Informations"
// et dans le commentaire d'en-tête du fichier (à garder synchronisés).
const APP_VERSION = "0.3.0";
const APP_AUTHOR = "Franck Legrand <franck.legrand@gmail.com>";
const APP_DATE = "2026-09-24";
const APP_LICENSE = "Utilisation libre (usage personnel/éducatif), sans garantie.";

// Pop-up "Informations" : version, auteur, date, licence (valeurs issues des constantes APP_*).
const infoDialog = document.getElementById("infoDialog");
document.getElementById("infoVersion").textContent = APP_VERSION;
document.getElementById("infoAuthor").textContent = APP_AUTHOR;
document.getElementById("infoDate").textContent = APP_DATE;
document.getElementById("infoLicense").textContent = APP_LICENSE;
document.getElementById("infoLink").addEventListener("click", () => infoDialog.showModal());
document.getElementById("infoClose").addEventListener("click", () => infoDialog.close());

// ---------- Banque de questions locale ----------
// Chaque question : catégorie, niveau (1-3), texte, et un mode d'évaluation.
const QUESTION_BANK = {
  calcul: [
    { level:1, text:"Combien font trois plus quatre ?", type:"number", answer:7 },
    { level:1, text:"Combien font cinq plus deux ?", type:"number", answer:7 },
    { level:1, text:"Combien font huit moins trois ?", type:"number", answer:5 },
    { level:1, text:"Combien font deux plus deux ?", type:"number", answer:4 },
    { level:1, text:"Combien font six plus un ?", type:"number", answer:7 },
    { level:1, text:"Combien font neuf moins quatre ?", type:"number", answer:5 },
    { level:1, text:"Combien font quatre plus quatre ?", type:"number", answer:8 },
    { level:1, text:"Combien font sept moins deux ?", type:"number", answer:5 },
    { level:2, text:"Combien font douze moins cinq ?", type:"number", answer:7 },
    { level:2, text:"Combien font six fois trois ?", type:"number", answer:18 },
    { level:2, text:"Combien font neuf plus huit ?", type:"number", answer:17 },
    { level:2, text:"Combien font quinze moins six ?", type:"number", answer:9 },
    { level:2, text:"Combien font quatre fois quatre ?", type:"number", answer:16 },
    { level:2, text:"Combien font treize plus six ?", type:"number", answer:19 },
    { level:2, text:"Combien font vingt moins huit ?", type:"number", answer:12 },
    { level:2, text:"Combien font sept fois deux ?", type:"number", answer:14 },
    { level:3, text:"Combien font quatorze plus dix-sept ?", type:"number", answer:31 },
    { level:3, text:"Combien font quatre-vingts moins trente-trois ?", type:"number", answer:47 },
    { level:3, text:"Combien font huit fois sept ?", type:"number", answer:56 },
    { level:3, text:"Combien font cinquante-cinq plus vingt-neuf ?", type:"number", answer:84 },
    { level:3, text:"Combien font cent moins quarante-quatre ?", type:"number", answer:56 },
    { level:3, text:"Combien font neuf fois six ?", type:"number", answer:54 },
    { level:3, text:"Combien font soixante-treize moins dix-huit ?", type:"number", answer:55 },
  ],
  memoire: [
    { level:1, text:"Quelle est la couleur du ciel par une journée claire ?", type:"keyword", keywords:["bleu"] },
    { level:1, text:"Quelle est la couleur de l'herbe ?", type:"keyword", keywords:["vert"] },
    { level:1, text:"Quel est le prénom de ta mère ?", type:"free" },
    { level:1, text:"Combien de doigts as-tu sur une main ?", type:"number", answer:5 },
    { level:2, text:"Cite trois prénoms qui commencent par la lettre A.", type:"free" },
    { level:2, text:"Cite trois prénoms qui commencent par la lettre M.", type:"free" },
    { level:2, text:"Quel est le prénom de ton père ?", type:"free" },
    { level:2, text:"Épelle ton prénom, lettre par lettre.", type:"free" },
    { level:3, text:"Récite les jours de la semaine dans l'ordre, en commençant par lundi.", type:"free" },
    { level:3, text:"Récite les mois de l'année dans l'ordre, en commençant par janvier.", type:"free" },
    { level:3, text:"Répète dans l'ordre : pomme, table, fenêtre.", type:"free" },
  ],
  observation: [
    { level:1, text:"Cite un animal qui vit dans l'eau.", type:"free" },
    { level:1, text:"Cite un pays d'Europe.", type:"free" },
    { level:1, text:"Cite la couleur des vêtements que tu portes.", type:"free" },
    { level:1, text:"Cite un fruit.", type:"free" },
    { level:2, text:"Cite trois objets que l'on trouve dans une cuisine.", type:"free" },
    { level:2, text:"Cite trois objets que l'on trouve dans un salon.", type:"free" },
    { level:2, text:"Cite deux moyens de transport.", type:"free" },
    { level:2, text:"Cite un instrument de musique.", type:"free" },
    { level:3, text:"Cite une ville de France qui commence par la lettre M.", type:"keyword_or_free", keywords:["marseille","metz","montpellier","mulhouse","le mans","montreuil"] },
    { level:3, text:"Cite la capitale d'un pays d'Europe.", type:"free" },
    { level:3, text:"Cite un animal qui commence par la lettre L.", type:"keyword_or_free", keywords:["lion","loup","lapin","lynx","lama"] },
    { level:3, text:"Cite un pays d'Amérique du Sud.", type:"free" },
  ],
  logique: [
    { level:1, text:"Quel nombre vient après sept ?", type:"number", answer:8 },
    { level:1, text:"Quel nombre vient avant dix ?", type:"number", answer:9 },
    { level:1, text:"Quel nombre vient après trois ?", type:"number", answer:4 },
    { level:2, text:"Dans la suite deux, quatre, six, huit, quel est le nombre suivant ?", type:"number", answer:10 },
    { level:2, text:"Dans la suite cinq, dix, quinze, vingt, quel est le nombre suivant ?", type:"number", answer:25 },
    { level:2, text:"Dans la suite un, trois, cinq, sept, quel est le nombre suivant ?", type:"number", answer:9 },
    { level:3, text:"Dans la suite un, un, deux, trois, cinq, quel est le nombre suivant ?", type:"number", answer:8 },
    { level:3, text:"Dans la suite trois, six, douze, vingt-quatre, quel est le nombre suivant ?", type:"number", answer:48 },
    { level:3, text:"Dans la suite cent, quatre-vingt-dix, quatre-vingts, soixante-dix, quel est le nombre suivant ?", type:"number", answer:60 },
  ],
  conversation: [
    { level:1, text:"Décris en une phrase l'endroit où tu te trouves.", type:"free" },
    { level:1, text:"Quel jour sommes-nous aujourd'hui ?", type:"free" },
    { level:1, text:"En un mot, comment te sens-tu en ce moment ?", type:"free" },
    { level:2, text:"Quelle est ta saison préférée, et pourquoi ?", type:"free" },
    { level:2, text:"Quel est ton plat préféré ?", type:"free" },
    { level:2, text:"Raconte un souvenir agréable récent.", type:"free" },
    { level:3, text:"Décris ta journée idéale en quelques mots.", type:"free" },
    { level:3, text:"Qu'est-ce qui te fait sourire en général ?", type:"free" },
  ],
};

// ---------- État de session (cf. machine à états du document de conception) ----------
const STATE_LABELS = {
  STARTING:"Démarrage…", SPEAKING:"🗣️ Question en cours", LISTENING:"🎙️ Écoute…",
  EVALUATING:"Analyse…", NEXT_QUESTION:"Question suivante", STOPPED:"Session terminée",
};
let running = false;
let level = 1;
let correctStreak = 0, wrongStreak = 0;
let recentQuestions = [];
let selectedVoice = null;
let rate = 1.0;

const screenHome = document.getElementById("screen-home");
const screenSession = document.getElementById("screen-session");
const screenSettings = document.getElementById("screen-settings");
const stateDot = document.getElementById("stateDot");
const stateLabel = document.getElementById("stateLabel");
const levelBadge = document.getElementById("levelBadge");
const questionText = document.getElementById("questionText");
const transcriptText = document.getElementById("transcriptText");

function showScreen(name) {
  screenHome.hidden = name !== "home";
  screenSession.hidden = name !== "session";
  screenSettings.hidden = name !== "settings";
}

function setState(s) {
  stateLabel.textContent = STATE_LABELS[s] || s;
  stateDot.className = "state-dot " + s.toLowerCase();
  levelBadge.textContent = "niveau " + level;
}

function wait(ms) { return new Promise(r => setTimeout(r, ms)); }

// ---------- Voix (Text-to-Speech) ----------
function speak(text) {
  return new Promise(resolve => {
    if (!running) { resolve(); return; }
    synth.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = "fr-FR";
    utter.rate = rate;
    if (selectedVoice) utter.voice = selectedVoice;
    utter.onend = resolve;
    utter.onerror = resolve;
    synth.speak(utter);
  });
}

// ---------- Écoute (Speech-to-Text) ----------
function listen() {
  return new Promise(resolve => {
    if (!sttSupported || !running) { resolve(null); return; }
    let done = false;
    recognizer.onresult = e => { done = true; resolve(e.results[0][0].transcript); };
    recognizer.onerror = () => { if (!done) { done = true; resolve(null); } };
    recognizer.onend = () => { if (!done) { done = true; resolve(null); } };
    try { recognizer.start(); } catch (e) { resolve(null); }
  });
}

// ---------- Évaluation grossière de la réponse ----------
function normalize(s) {
  return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
}
const NUMBER_WORDS = {
  zero:0, un:1, une:1, deux:2, trois:3, quatre:4, cinq:5, six:6, sept:7, huit:8, neuf:9, dix:10,
  onze:11, douze:12, treize:13, quatorze:14, quinze:15, seize:16,
  "dix-sept":17, "dix-huit":18, "dix-neuf":19, vingt:20, trente:30, quarante:40,
  cinquante:50, soixante:60, "quatre-vingt":80, "quatre-vingts":80, "quatre-vingt-dix":90,
};
function extractNumber(transcript) {
  const digitMatch = transcript.match(/-?\d+/);
  if (digitMatch) return parseInt(digitMatch[0], 10);
  const norm = normalize(transcript);
  for (const word in NUMBER_WORDS) {
    if (norm.includes(word)) return NUMBER_WORDS[word];
  }
  return null;
}
function evaluateAnswer(question, transcript) {
  if (!transcript) return false;
  const norm = normalize(transcript);
  switch (question.type) {
    case "number":
      return extractNumber(transcript) === question.answer;
    case "keyword":
      return question.keywords.some(k => norm.includes(normalize(k)));
    case "keyword_or_free":
      return question.keywords.some(k => norm.includes(normalize(k))) || norm.length > 2;
    case "free":
    default:
      return norm.length > 1;
  }
}

// ---------- Sélection adaptative de la question suivante ----------
function pickQuestion(lvl) {
  let pool = [];
  for (const cat in QUESTION_BANK) {
    QUESTION_BANK[cat].forEach(q => { if (q.level === lvl) pool.push(q); });
  }
  if (pool.length === 0) {
    for (const cat in QUESTION_BANK) pool.push(...QUESTION_BANK[cat]);
  }
  let candidates = pool.filter(q => !recentQuestions.includes(q.text));
  if (candidates.length === 0) candidates = pool;
  return candidates[Math.floor(Math.random() * candidates.length)];
}
function adjustLevel() {
  if (correctStreak >= 2) { level = Math.min(3, level + 1); correctStreak = 0; }
  if (wrongStreak >= 2) { level = Math.max(1, level - 1); wrongStreak = 0; }
}

// ---------- Boucle de session ----------
async function runSession() {
  running = true;
  level = Number(document.getElementById("levelSelect").value) || 1;
  correctStreak = 0; wrongStreak = 0; recentQuestions = [];

  showScreen("session");
  setState("STARTING");
  questionText.textContent = "Préparation…";
  transcriptText.textContent = "";
  await speak("On va faire quelques exercices simples. Respire, et écoute la première question.");

  while (running) {
    const question = pickQuestion(level);
    recentQuestions.push(question.text);
    if (recentQuestions.length > 5) recentQuestions.shift();

    if (!running) return;
    questionText.textContent = question.text;
    transcriptText.textContent = "";
    setState("SPEAKING");
    await speak(question.text);
    if (!running) return;

    if (!sttSupported) {
      setState("NEXT_QUESTION");
      await wait(2200);
      continue;
    }

    setState("LISTENING");
    const transcript = await listen();
    if (!running) return;
    transcriptText.textContent = transcript ? "« " + transcript + " »" : "(pas de réponse détectée)";

    setState("EVALUATING");
    await wait(250);
    const correct = evaluateAnswer(question, transcript);
    if (correct) { correctStreak++; wrongStreak = 0; }
    else { wrongStreak++; correctStreak = 0; }
    adjustLevel();

    setState("NEXT_QUESTION");
    await wait(400);
  }
}

function stopSession() {
  running = false;
  synth.cancel();
  if (sttSupported) { try { recognizer.abort(); } catch (e) {} }
  setState("STOPPED");
  questionText.textContent = "Session arrêtée.";
  transcriptText.textContent = "";
  setTimeout(() => showScreen("home"), 1100);
}

document.getElementById("panicBtn").addEventListener("click", runSession);
document.getElementById("stopBtn").addEventListener("click", stopSession);
document.getElementById("openSettings").addEventListener("click", () => showScreen("settings"));
document.getElementById("backHome").addEventListener("click", () => showScreen("home"));

// ---------- Réglages voix ----------
const voiceSelect = document.getElementById("voiceSelect");
const rateInput = document.getElementById("rateInput");
const rateValue = document.getElementById("rateValue");

function loadVoices() {
  const all = synth.getVoices();
  const fr = all.filter(v => v.lang && v.lang.toLowerCase().startsWith("fr"));
  const list = fr.length ? fr : all;
  voiceSelect.innerHTML = "";
  list.forEach((v, i) => {
    const opt = document.createElement("option");
    opt.value = i;
    opt.textContent = v.name + " (" + v.lang + ")";
    voiceSelect.appendChild(opt);
  });
  voiceSelect._voices = list;
  if (list.length) selectedVoice = list[0];
}
synth.onvoiceschanged = loadVoices;
loadVoices();

voiceSelect.addEventListener("change", e => {
  selectedVoice = voiceSelect._voices[Number(e.target.value)];
});
rateInput.addEventListener("input", e => {
  rate = Number(e.target.value);
